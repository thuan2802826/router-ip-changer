name: Build Router IP Changer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/example/routerip
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RouterIPChanger"
          include ':app'
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # build.gradle (root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.routerip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.routerip"
                  minSdk 21
                  targetSdk 34
                  versionCode 7
                  versionName "1.0.6"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # Drawables
          cat << 'EOF' > app/src/main/res/drawable/card_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#161B22"/>
              <corners android:radius="14dp"/>
              <stroke android:width="1dp" android:color="#30363D"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/card_new_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0F241A"/>
              <corners android:radius="14dp"/>
              <stroke android:width="1.5dp" android:color="#238636"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/terminal_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#080B0F"/>
              <corners android:radius="12dp"/>
              <stroke android:width="1dp" android:color="#21262D"/>
          </shape>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="Đổi IP Mạng"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0D1117"
              android:padding="20dp">

              <!-- App Header -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:layout_marginTop="8dp"
                  android:layout_marginBottom="24dp">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🌐 "
                          android:textSize="26sp"/>

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="ĐỔI IP MẠNG"
                          android:textColor="#FFFFFF"
                          android:textSize="22sp"
                          android:textStyle="bold"
                          android:letterSpacing="0.04"/>
                  </LinearLayout>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Hạ tầng kết nối Viettel Telecom"
                      android:textColor="#8B949E"
                      android:textSize="12sp"
                      android:layout_marginTop="4dp"/>
              </LinearLayout>

              <!-- Current IP Card -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@drawable/card_bg"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:layout_marginBottom="14dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📍 ĐỊA CHỈ IP BAN ĐẦU"
                      android:textColor="#F0883E"
                      android:textSize="12sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:id="@+id/tvOldIpv4"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Đang lấy..."
                      android:textColor="#E6EDF3"
                      android:textSize="24sp"
                      android:textStyle="bold"
                      android:layout_marginTop="8dp"/>

                  <TextView
                      android:id="@+id/tvOldIpv6"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="IPv6: Đang kiểm tra..."
                      android:textColor="#8B949E"
                      android:textSize="12sp"
                      android:fontFamily="monospace"
                      android:layout_marginTop="4dp"/>
              </LinearLayout>

              <!-- New IP Card (Hidden initially, slides in on completion) -->
              <LinearLayout
                  android:id="@+id/cardNewIp"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@drawable/card_new_bg"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:visibility="gone"
                  android:layout_marginBottom="16dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="✨ ĐỊA CHỈ IP MỚI CẤP PHÁT"
                      android:textColor="#3FB950"
                      android:textSize="12sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:id="@+id/tvNewIpv4"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="..."
                      android:textColor="#3FB950"
                      android:textSize="24sp"
                      android:textStyle="bold"
                      android:layout_marginTop="8dp"/>

                  <TextView
                      android:id="@+id/tvNewIpv6"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="IPv6: Đang lấy..."
                      android:textColor="#7EE787"
                      android:textSize="12sp"
                      android:fontFamily="monospace"
                      android:layout_marginTop="4dp"/>
              </LinearLayout>

              <!-- Action Button -->
              <com.google.android.material.button.MaterialButton
                  android:id="@+id/btnChangeIp"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="⚡ BẮT ĐẦU ĐỔI IP MẠNG"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  app:cornerRadius="12dp"
                  app:backgroundTint="#1F6FEB"
                  android:layout_marginBottom="8dp"/>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="@style/Widget.AppCompat.ProgressBar.Horizontal"
                  android:layout_width="match_parent"
                  android:layout_height="4dp"
                  android:indeterminate="true"
                  android:visibility="gone"
                  android:layout_marginBottom="16dp"/>

              <!-- Connection Progress Header -->
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="TIẾN TRÌNH KẾT NỐI MẠNG"
                  android:textColor="#8B949E"
                  android:textSize="11sp"
                  android:textStyle="bold"
                  android:letterSpacing="0.05"
                  android:layout_marginTop="8dp"
                  android:layout_marginBottom="8dp"/>

              <!-- Terminal Status Console -->
              <ScrollView
                  android:id="@+id/scrollConsole"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="@drawable/terminal_bg"
                  android:padding="14dp">

                  <TextView
                      android:id="@+id/tvConsoleLog"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="• [Hệ thống] Tuyến mạng Viettel sẵn sàng."
                      android:textColor="#3FB950"
                      android:textSize="12sp"
                      android:fontFamily="monospace"
                      android:lineSpacingExtra="5dp"/>
              </ScrollView>

          </LinearLayout>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/example/routerip/MainActivity.java
          package com.example.routerip;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          import java.io.InputStream;
          import java.net.Inet6Address;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.security.KeyStore;
          import java.security.SecureRandom;
          import java.security.cert.CertificateFactory;
          import java.security.cert.X509Certificate;
          import java.text.SimpleDateFormat;
          import java.util.Collections;
          import java.util.Date;
          import java.util.Enumeration;
          import java.util.Locale;
          import java.util.concurrent.TimeUnit;

          import javax.net.ssl.SSLContext;
          import javax.net.ssl.TrustManager;
          import javax.net.ssl.X509TrustManager;

          import okhttp3.FormBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;

          public class MainActivity extends AppCompatActivity {

              private TextView tvOldIpv4, tvOldIpv6, tvNewIpv4, tvNewIpv6, tvConsoleLog;
              private LinearLayout cardNewIp;
              private Button btnChangeIp;
              private ProgressBar progressBar;
              private ScrollView scrollConsole;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final SimpleDateFormat timeFormat = new SimpleDateFormat("HH:mm:ss", Locale.getDefault());
              private String originalIpv4 = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  tvOldIpv4 = findViewById(R.id.tvOldIpv4);
                  tvOldIpv6 = findViewById(R.id.tvOldIpv6);
                  tvNewIpv4 = findViewById(R.id.tvNewIpv4);
                  tvNewIpv6 = findViewById(R.id.tvNewIpv6);
                  tvConsoleLog = findViewById(R.id.tvConsoleLog);
                  cardNewIp = findViewById(R.id.cardNewIp);
                  btnChangeIp = findViewById(R.id.btnChangeIp);
                  progressBar = findViewById(R.id.progressBar);
                  scrollConsole = findViewById(R.id.scrollConsole);

                  btnChangeIp.setOnClickListener(v -> executeNetworkRotation());
                  loadInitialIps();
              }

              private void appendLog(String message) {
                  String time = timeFormat.format(new Date());
                  handler.post(() -> {
                      tvConsoleLog.append("\n• [" + time + "] " + message);
                      scrollConsole.post(() -> scrollConsole.fullScroll(View.FOCUS_DOWN));
                  });
              }

              private OkHttpClient getUnsafeOkHttpClient() {
                  try {
                      final TrustManager[] trustAllCerts = new TrustManager[]{
                          new X509TrustManager() {
                              @Override
                              public void checkClientTrusted(X509Certificate[] chain, String authType) {}
                              @Override
                              public void checkServerTrusted(X509Certificate[] chain, String authType) {}
                              @Override
                              public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[]{}; }
                          }
                      };
                      final SSLContext sslContext = SSLContext.getInstance("SSL");
                      sslContext.init(null, trustAllCerts, new SecureRandom());
                      return new OkHttpClient.Builder()
                          .sslSocketFactory(sslContext.getSocketFactory(), (X509TrustManager) trustAllCerts[0])
                          .hostnameVerifier((hostname, session) -> true)
                          .connectTimeout(10, TimeUnit.SECONDS)
                          .readTimeout(10, TimeUnit.SECONDS)
                          .build();
                  } catch (Exception e) {
                      return new OkHttpClient();
                  }
              }

              private String fetchUrl(String url) {
                  try {
                      OkHttpClient client = new OkHttpClient.Builder()
                          .connectTimeout(4, TimeUnit.SECONDS)
                          .readTimeout(4, TimeUnit.SECONDS)
                          .build();
                      Request request = new Request.Builder().url(url).build();
                      Response response = client.newCall(request).execute();
                      if (response.isSuccessful() && response.body() != null) {
                          return response.body().string().trim();
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private String getIpv4() {
                  String[] urls = new String[]{
                      "https://api.ipify.org",
                      "https://checkip.amazonaws.com",
                      "https://icanhazip.com",
                      "https://ifconfig.me/ip"
                  };
                  for (String u : urls) {
                      String ip = fetchUrl(u);
                      if (ip != null && !ip.isEmpty() && !ip.contains(":")) {
                          return ip;
                      }
                  }
                  return "Chưa lấy được IP";
              }

              private String getIpv6() {
                  // Strategy 1: Read directly from Android Network Interfaces (Wi-Fi SLAAC global address)
                  try {
                      Enumeration<NetworkInterface> interfaces = NetworkInterface.getNetworkInterfaces();
                      for (NetworkInterface iface : Collections.list(interfaces)) {
                          if (iface.isLoopback() || !iface.isUp()) continue;
                          for (InetAddress addr : Collections.list(iface.getInetAddresses())) {
                              if (addr instanceof Inet6Address && !addr.isLoopbackAddress() && !addr.isLinkLocalAddress()) {
                                  String host = addr.getHostAddress();
                                  if (host != null) {
                                      int percentIdx = host.indexOf('%');
                                      if (percentIdx > 0) host = host.substring(0, percentIdx);
                                      // Viettel / Global IPv6 starts with 2xxx or 3xxx
                                      if (host.startsWith("2") || host.startsWith("3")) {
                                          return host;
                                      }
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {}

                  // Strategy 2: External IPv6-only HTTP endpoints fallback
                  String[] urls = new String[]{
                      "https://api6.ipify.org",
                      "https://ipv6.icanhazip.com",
                      "https://v6.ident.me",
                      "https://ipv6.seeip.org"
                  };
                  for (String u : urls) {
                      String ip = fetchUrl(u);
                      if (ip != null && ip.contains(":")) {
                          return ip;
                      }
                  }
                  return "Không có IPv6";
              }

              private void loadInitialIps() {
                  appendLog("Đang nhận diện địa chỉ mạng ban đầu...");
                  new Thread(() -> {
                      originalIpv4 = getIpv4();
                      String ipv6 = getIpv6();
                      handler.post(() -> {
                          tvOldIpv4.setText(originalIpv4);
                          tvOldIpv6.setText("IPv6: " + ipv6);
                      });
                      appendLog("Nhận diện mạng hoàn tất. IP hiện tại: " + originalIpv4);
                  }).start();
              }

              private void executeNetworkRotation() {
                  btnChangeIp.setEnabled(false);
                  progressBar.setVisibility(View.VISIBLE);

                  new Thread(() -> {
                      try {
                          appendLog("Đang kết nối trung tâm điều phối Viettel...");
                          OkHttpClient client = getUnsafeOkHttpClient();
                          String routerUrl = "https://192.168.1.1";

                          // Phase 1: Authentication
                          Request rCount = new Request.Builder()
                              .url(routerUrl + "/html/ssmp/common/GetRandCount.asp")
                              .post(new FormBody.Builder().build())
                              .build();
                          Response resCount = client.newCall(rCount).execute();
                          String cnt = resCount.body().string().replaceAll("[^a-zA-Z0-9]", "");

                          Request rLogin = new Request.Builder()
                              .url(routerUrl + "/login.cgi")
                              .post(new FormBody.Builder()
                                  .add("UserName", "admin")
                                  .add("PassWord", "123456")
                                  .add("x.X_HW_Token", cnt)
                                  .build())
                              .build();
                          Response resLogin = client.newCall(rLogin).execute();
                          String cookieHeader = resLogin.header("Set-Cookie");
                          if (cookieHeader == null || !cookieHeader.contains("Cookie=")) {
                              throw new Exception("Xác thực thiết bị không thành công (Kiểm tra Wi-Fi Viettel)");
                          }

                          appendLog("Đang giải phóng phiên kết nối mạng...");

                          // Phase 2: Session Token
                          Request rToken1 = new Request.Builder()
                              .url(routerUrl + "/html/ssmp/common/GetRandToken.asp")
                              .addHeader("Cookie", cookieHeader)
                              .post(new FormBody.Builder().build())
                              .build();
                          Response resToken1 = client.newCall(rToken1).execute();
                          String t1 = resToken1.body().string().replaceAll("[^a-zA-Z0-9]", "");

                          // Phase 3: WAN Disconnect
                          String setUrl = routerUrl + "/html/bbsp/common/set.cgi?x=InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnection.1&RequestFile=html/bbsp/wan/wan.asp";
                          Request rDisable = new Request.Builder()
                              .url(setUrl)
                              .addHeader("Cookie", cookieHeader)
                              .post(new FormBody.Builder().add("x.Enable", "0").add("x.X_HW_Token", t1).build())
                              .build();
                          try {
                              client.newCall(rDisable).execute().close();
                          } catch (Exception ignored) {}

                          appendLog("Đang yêu cầu trạm Viettel cấp phát dải IP mới...");
                          Thread.sleep(6000);

                          // Phase 4: WAN Reconnect
                          appendLog("Đang kích hoạt đường truyền Internet Viettel...");
                          Request rToken2 = new Request.Builder()
                              .url(routerUrl + "/html/ssmp/common/GetRandToken.asp")
                              .addHeader("Cookie", cookieHeader)
                              .post(new FormBody.Builder().build())
                              .build();
                          Response resToken2 = client.newCall(rToken2).execute();
                          String t2 = resToken2.body().string().replaceAll("[^a-zA-Z0-9]", "");

                          Request rEnable = new Request.Builder()
                              .url(setUrl)
                              .addHeader("Cookie", cookieHeader)
                              .post(new FormBody.Builder().add("x.Enable", "1").add("x.X_HW_Token", t2).build())
                              .build();
                          try {
                              client.newCall(rEnable).execute().close();
                          } catch (Exception ignored) {}

                          appendLog("Đang đồng bộ tuyến truyền dẫn và thông số mạng...");

                          // Phase 5: Wait and Poll until new IP is assigned
                          String newIpv4 = null;
                          String newIpv6 = null;

                          for (int attempt = 1; attempt <= 15; attempt++) {
                              Thread.sleep(2000);
                              appendLog("Đang kiểm tra tín hiệu trạm mạng Viettel (" + attempt + "/15)...");
                              String checkIp = getIpv4();
                              if (!checkIp.equals("Chưa lấy được IP") && !checkIp.equals(originalIpv4)) {
                                  newIpv4 = checkIp;
                                  newIpv6 = getIpv6();
                                  break;
                              }
                          }

                          if (newIpv4 == null || newIpv4.equals(originalIpv4)) {
                              throw new Exception("Hạ tầng Viettel chưa cấp IP mới, vui lòng bấm thử lại");
                          }

                          final String finalIpv4 = newIpv4;
                          final String finalIpv6 = newIpv6;

                          handler.post(() -> {
                              tvNewIpv4.setText(finalIpv4);
                              tvNewIpv6.setText("IPv6: " + finalIpv6);

                              // Smooth Slide & Fade In Animation
                              cardNewIp.setAlpha(0f);
                              cardNewIp.setTranslationY(40f);
                              cardNewIp.setVisibility(View.VISIBLE);
                              cardNewIp.animate()
                                  .alpha(1f)
                                  .translationY(0f)
                                  .setDuration(600)
                                  .start();
                          });

                          appendLog("✅ Hoàn tất! Đã nhận dải IP mới: " + finalIpv4);
                      } catch (Exception e) {
                          appendLog("❌ Không thể đồng bộ: " + e.getMessage());
                      } finally {
                          handler.post(() -> {
                              btnChangeIp.setEnabled(true);
                              progressBar.setVisibility(View.GONE);
                          });
                      }
                  }).start();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoiIPRouter-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "Đổi IP Mạng v1.0.6"
          files: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
